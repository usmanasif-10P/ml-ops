parameters:
- name: serviceconnectionname
  default: ''

steps:
- checkout: self

- script: az extension add -n ml -y
  displayName: 'Install Azure ML CLI v2'
  # This runs on a Microsoft-hosted Ubuntu agent, not your Windows machine -
  # the cryptography/maturin build failure you hit locally was Windows-
  # specific (no prebuilt wheel for az CLI's bundled Windows Python).
  # Linux wheels are far more consistently available, same reason Cloud
  # Shell worked - this step should succeed cleanly here.

- task: AzureCLI@2
  inputs:
    azureSubscription: ${{ parameters.serviceconnectionname }}
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: $(Build.SourcesDirectory)
    inlineScript: |
      az ml job create --file .az/pipeline-job.yml \
        --resource-group ML-OPS-POC-UsmanAsif --workspace-name MLOPS
  displayName: 'Run Azure Machine Learning Pipeline'

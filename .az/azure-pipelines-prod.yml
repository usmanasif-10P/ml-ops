trigger:
- production

stages:
- stage: deployProd
  displayName: 'Deploy to prod environment'
  jobs:
    - deployment: publishPipeline
      displayName: 'Model Training'
      pool:
        vmImage: 'ubuntu-latest'
      environment: production
      strategy:
       runOnce:
         deploy:
          steps:
          - template: aml-steps.yml
            parameters:
              # The service connection you already created and verified -
              # holds Azure-Devops-UsmanAsif's client ID/secret/tenant ID,
              # already granted Contributor on ML-OPS-POC-UsmanAsif
              serviceconnectionname: 'MLOps Prod'

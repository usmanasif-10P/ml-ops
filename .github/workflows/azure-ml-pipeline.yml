name: Run Azure ML Pipeline

on:
  push:
    tags:
      - 'v*'           # e.g. v1.0.0 - a plain commit push never triggers this
  workflow_dispatch:   # lets you also trigger this manually from the Actions tab

jobs:
  run-aml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install az ml extension
        run: az extension add -n ml -y
        # Runs on ubuntu-latest, not Windows - the local cryptography/maturin
        # build failure was Windows-specific and shouldn't recur here.

      - name: Run Azure ML pipeline
        run: >-
          az ml job create --file .az/pipeline-job.yml
          --resource-group ML-OPS-POC-UsmanAsif --workspace-name MLOPS
